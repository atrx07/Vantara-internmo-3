project:
  name: Vantara Customer Behavior Prediction Platform
  python_version: "3.11"
  random_seed: 42

logging:
  level: INFO

data:
  raw_workbook: data/raw/online_retail_II.xlsx
  expected_sha256: bcbe73b35f5b7babf197fb0cb983a11f5d9ff929078d4aa53d171b1f2df2e980
  sheets:
    Year 2009-2010: 525461
    Year 2010-2011: 541910
  source_columns:
    - Invoice
    - StockCode
    - Description
    - Quantity
    - InvoiceDate
    - Price
    - Customer ID
    - Country
  canonical_columns:
    Invoice: invoice
    StockCode: stock_code
    Description: description
    Quantity: quantity
    InvoiceDate: invoice_date
    Price: price
    Customer ID: customer_id
    Country: country
  expected_date_range:
    minimum: "2009-12-01 07:45:00"
    maximum: "2011-12-09 12:50:00"
  maximum_null_rates:
    invoice: 0.0
    stock_code: 0.0
    description: 0.01
    quantity: 0.0
    invoice_date: 0.0
    price: 0.0
    customer_id: 0.30
    country: 0.0

cleaning:
  interim_transactions: data/interim/transactions_clean.parquet
  outlier_audit: data/interim/outlier_audit.parquet
  administrative_stock_codes:
    - ADJUST
    - ADJUST2
    - AMAZONFEE
    - B
    - BANK CHARGES
    - C2
    - CRUK
    - D
    - DOT
    - GIFT_0001_10
    - GIFT_0001_20
    - GIFT_0001_30
    - GIFT_0001_40
    - GIFT_0001_50
    - M
    - PADS
    - POST
    - S
    - SP1002
    - TEST001
    - TEST002
  administrative_stock_code_patterns:
    - "^ADJUST"
    - "^AMAZONFEE$"
    - "^BANK CHARGES$"
    - "^GIFT_"
    - "^TEST"
  outliers:
    iqr_multiplier: 3.0
    quantity_absolute_domain_limit: 100000
    price_domain_limit: 50000.0

snapshots:
  churn_horizon_days: 90
  clv_horizon_days: 180
  trend_window_days: 90

features:
  markdown_price_ratio: 0.90
  markdown_min_observations: 5
  taxonomy:
    version: vantara-taxonomy-v1
    candidate_clusters: [12, 16, 20, 24, 30]
    max_tfidf_features: 5000
    svd_components: 50
    silhouette_sample_size: 2000
    min_cluster_share: 0.01
  split:
    version: vantara-customer-split-v1
    train_fraction: 0.70
    validation_fraction: 0.15
    test_fraction: 0.15
    seed: 42

outputs:
  customer_split: data/processed/customer_split.parquet
  churn_features: data/processed/customer_features_churn.parquet
  clv_features: data/processed/customer_features_clv.parquet
  product_taxonomy: data/processed/product_taxonomy.parquet
  product_reference_prices: data/processed/product_reference_prices.parquet
  product_frequency_encoding: data/processed/product_frequency_encoding.parquet
  preprocessing_artifacts: data/processed/preprocessing_contracts.joblib
  step02_metadata: data/processed/step02_metadata.json

analysis:
  evidence_directory: reports/eda
  data_freeze_directory: reports/data_freeze
  churn_feature_schema: models_artifacts/churn_feature_schema.json
  correlation_threshold: 0.95
  vif_threshold: 10.0
  feature_schema_version: vantara-churn-features-v1
  top_countries: 15

modeling:
  experiment_name: vantara-step04
  tracking_directory: mlruns
  artifact_directory: models_artifacts/step04
  evidence_directory: reports/modeling
  churn:
    logistic_regression:
      penalty: [l1, l2]
      C: [0.1, 1.0, 10.0]
    decision_tree:
      candidates:
        - {max_depth: 4, min_samples_leaf: 5}
        - {max_depth: 8, min_samples_leaf: 10}
        - {max_depth: null, min_samples_leaf: 20}
    random_forest:
      candidates:
        - {n_estimators: 160, max_depth: null, min_samples_leaf: 2, max_features: sqrt}
        - {n_estimators: 240, max_depth: 12, min_samples_leaf: 5, max_features: 0.7}
        - {n_estimators: 200, max_depth: 8, min_samples_leaf: 10, max_features: sqrt}
    xgboost:
      candidates:
        - {n_estimators: 160, max_depth: 3, learning_rate: 0.05, subsample: 0.85, colsample_bytree: 0.85}
        - {n_estimators: 240, max_depth: 4, learning_rate: 0.03, subsample: 1.0, colsample_bytree: 0.8}
        - {n_estimators: 180, max_depth: 5, learning_rate: 0.07, subsample: 0.8, colsample_bytree: 1.0}
    lightgbm:
      candidates:
        - {n_estimators: 160, num_leaves: 15, learning_rate: 0.05, min_child_samples: 20}
        - {n_estimators: 240, num_leaves: 31, learning_rate: 0.03, min_child_samples: 30}
        - {n_estimators: 180, num_leaves: 20, learning_rate: 0.07, min_child_samples: 40}
    svm:
      candidates:
        - {C: 0.5, gamma: scale, kernel: rbf}
        - {C: 1.0, gamma: 0.02, kernel: rbf}
        - {C: 3.0, gamma: 0.05, kernel: rbf}
  clv:
    prediction_cap: training_target_max
    ridge_alpha: [0.1, 1.0, 10.0, 100.0]
    xgboost_candidates:
      - {n_estimators: 180, max_depth: 3, learning_rate: 0.04, subsample: 0.85, colsample_bytree: 0.85}
      - {n_estimators: 260, max_depth: 4, learning_rate: 0.03, subsample: 1.0, colsample_bytree: 0.8}
      - {n_estimators: 200, max_depth: 5, learning_rate: 0.06, subsample: 0.8, colsample_bytree: 1.0}
  segmentation:
    features:
      - recency_days
      - frequency_orders
      - net_spend
      - avg_order_value
      - avg_basket_units
      - purchase_frequency_trend
      - variance_interpurchase_gap_days
      - return_rate
      - markdown_affinity_proxy
      - seasonal_purchase_concentration
    kmeans_candidates: [3, 4, 5, 6, 7, 8]
    gmm_candidates: [2, 3, 4, 5, 6, 7, 8]
  next_category:
    candidates:
      - {n_estimators: 160, num_leaves: 15, learning_rate: 0.05, min_child_samples: 15}
      - {n_estimators: 240, num_leaves: 31, learning_rate: 0.03, min_child_samples: 20}
      - {n_estimators: 180, num_leaves: 20, learning_rate: 0.07, min_child_samples: 30}
  recommender:
    neighbors: 25
    top_k: 5

deep_learning:
  experiment_name: vantara-step05
  tracking_directory: mlruns
  artifact_directory: models_artifacts/step05
  evidence_directory: reports/deep_learning
  torch_threads: 2
  ann:
    batch_size: 128
    learning_rate: 0.001
    weight_decay: 0.0001
    dropout_first: 0.30
    dropout_second: 0.20
    max_epochs: 40
    patience: 6
    minimum_delta: 0.0001
  lstm:
    horizon_days: 30
    sequence_length: 20
    snapshot_frequency: MS
    max_snapshots_per_customer: 8
    minimum_history_events: 2
    embedding_size: 8
    hidden_size: 64
    dropout: 0.20
    batch_size: 256
    learning_rate: 0.001
    weight_decay: 0.0001
    cv_folds: 5
    cv_max_epochs: 4
    max_epochs: 15
    patience: 4
    minimum_delta: 0.0001
  autoencoder:
    features:
      - recency_days
      - frequency_orders
      - net_spend
      - avg_order_value
      - avg_basket_units
      - purchase_frequency_trend
      - variance_interpurchase_gap_days
      - return_rate
      - markdown_affinity_proxy
      - seasonal_purchase_concentration
    hidden_size: 32
    latent_size: 8
    batch_size: 128
    learning_rate: 0.001
    weight_decay: 0.0001
    max_epochs: 40
    patience: 6
    minimum_delta: 0.0001
    threshold_percentile: 99.0

model_freeze:
  evidence_directory: reports/model_freeze
  explainability_directory: reports/explainability
  final_evaluation_directory: reports/final_evaluation
  serving_artifact_root: models_artifacts
  minimum_recall: 0.70
  roc_auc_tolerance: 0.01
  threshold_beta: 2.0
  xai:
    validation_sample_size: 742
    background_sample_size: 200
    local_max_features: 12
    lime_features: 10
    pdp_features: 3
    other_model_sample_size: 200
